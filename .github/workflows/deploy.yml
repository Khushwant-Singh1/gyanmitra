name: Build and Deploy via GHCR

on:
  push:
    branches:
      - main # Change this if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        id: prep
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/gyanmitra-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/gyanmitra-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend-server/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/gyanmitra-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          envs: GHCR_USERNAME,GHCR_TOKEN,HOSTINGER_DEPLOY_PATH
          script: |
            set -e

            # Determine base and target directories
            BASE_DIR="$HOSTINGER_DEPLOY_PATH"
            if [[ "$BASE_DIR" == */apps ]]; then
              TARGET_DIR="$BASE_DIR"
            else
              TARGET_DIR="$BASE_DIR/apps"
            fi

            cd "$TARGET_DIR" || cd "$BASE_DIR"

            # Pull latest git changes on VPS if git repo exists
            if [ -d ".git" ]; then
              git pull origin main || git pull
            fi

            # Prepare production docker-compose
            if [ -f "docker-compose.prod.yml" ]; then
              cp docker-compose.prod.yml docker-compose.yml
            fi

            # Log in to GHCR on the VPS if credentials exist
            if [ -n "$GHCR_TOKEN" ] && [ -n "$GHCR_USERNAME" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin || true
            fi
            
            # Pull the prebuilt Docker images from GHCR
            docker compose pull
            
            # Drop stray containers from older deploys still holding our published ports
            docker ps -q --filter publish=8000 --filter publish=3000 --filter publish=8080 | xargs -r docker rm -f
            ss -ltnp 2>/dev/null | grep -E ':(8000|3000|8080)\b' || true

            # Re-launch the containers with newly pulled images
            docker compose up -d --force-recreate --remove-orphans
            
            # Clean up old/unused images to save disk space
            docker image prune -f
